<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Брошури</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700;800&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  /* Family 300: въглен, крем и опалено оранжево, с искри */
  --bg:#f6efe3; --surface:#fffbf4; --sunk:#ede3d2; --line:#e1d4bf;
  --fg:#2b2a28; --muted:#75695b; --pen:#c9561a; --pen-soft:#fbe4d3; --char:#2b2a28; --cream:#f6efe3;
  --ok:#2f7a4a; --ok-soft:#e1f0e3; --warn:#a86500; --warn-soft:#fbefd6; --bad:#b3261e; --bad-soft:#fbe2df;
  --f-d:"Unbounded","Golos Text",system-ui,sans-serif; --f-b:"Golos Text",system-ui,-apple-system,sans-serif;
  --f-s:"Caveat","Segoe Script",cursive; --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1f1d1b; --surface:#2a2724; --sunk:#35312d; --line:#44403a; --fg:#f3eadb; --muted:#b3a592;
  --pen:#f07b3a; --pen-soft:#43281a; --char:#141312; --cream:#f3eadb; --ok:#5fc68a; --ok-soft:#173226;
  --warn:#f0a83a; --warn-soft:#3a2a10; --bad:#ff7a70; --bad-soft:#3d1a18; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-b)}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-d);font-size:1.35rem;margin:0}
h1 span{color:var(--pen)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sp{flex:1}
.muted{color:var(--muted);font-size:.85rem}
.btn{font:inherit;font-weight:600;font-size:.88rem;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--pen);border-color:var(--pen);color:#fff}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pen);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:flex;flex-direction:column;gap:8px}
.row-f{display:flex;gap:12px;align-items:center;cursor:pointer;text-decoration:none;color:inherit}
.row-f .nm{font-weight:700}
.row-f .g{flex:1;min-width:0}
.badge{font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
.b-pending{background:var(--sunk);color:var(--muted)}.b-approved{background:var(--ok-soft);color:var(--ok)}
.b-counter{background:var(--warn-soft);color:var(--warn)}.b-rejected{background:var(--bad-soft);color:var(--bad)}
.b-sent{background:var(--ok);color:#fff}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.84rem;white-space:pre-line}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.stat .n{font-family:var(--f-d);font-size:1.15rem;font-variant-numeric:tabular-nums}
.stat .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.it-n{font-weight:600}
.code{font-family:var(--f-m);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.code b{color:var(--pen)}
.prices{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prices b{color:var(--fg)}
.g-ok{color:var(--ok)}.g-bad{color:var(--bad)}
.entry{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld input{width:84px;font:inherit;font-family:var(--f-m);font-size:.95rem;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.fld input.pen{color:var(--pen);border-color:var(--pen);background:var(--pen-soft);font-weight:600}
.fld input:disabled{opacity:.7}
.grp{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--pen);font-weight:700;margin-top:2px}
.mg{margin-left:auto;text-align:right;min-width:80px}
.mg .v{font-family:var(--f-m);font-weight:600}
.mg .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.m-good{color:var(--ok)}.m-mid{color:var(--warn)}.m-low{color:var(--bad)}
.dec{display:flex;flex-direction:column;gap:10px}
.dec .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,textarea,.inp{font:inherit;font-size:.9rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
textarea{width:100%;min-height:44px}
.btn.a[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.c[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.x[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.login{max-width:340px;margin:12vh auto 0;display:flex;flex-direction:column;gap:10px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.drop.on{border-color:var(--pen);color:var(--pen)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.85rem;z-index:9;max-width:90vw}
.back{font-size:.9rem;color:var(--muted);text-decoration:none}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.fld input{width:74px}}

.hero{position:relative;overflow:hidden;background:var(--char);color:var(--cream);border-radius:18px;padding:18px 18px 20px;display:flex;gap:16px;align-items:center}
.hero .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hero .hi{font-family:var(--f-s);font-size:1.6rem;color:#f3a66f;line-height:1}
.hero .ph{font-size:1.02rem;line-height:1.4;text-wrap:balance;opacity:0;animation:rise .9s .35s ease forwards}
.hero .dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#bfb2a0}
.logo{flex:none;display:block;position:relative}
.logo svg{position:absolute;inset:-18%;width:136%;height:136%;overflow:visible}
.logo img{position:relative;width:100%;height:100%;object-fit:contain;transform-origin:50% 60%}
.logo .pop{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
.logo .spk{stroke:#e8772e;stroke-width:3;stroke-linecap:round;stroke-dasharray:14;stroke-dashoffset:14;animation:spark 2.8s ease-out infinite}
.logo .spk:nth-child(2n){animation-delay:.25s}.logo .spk:nth-child(3n){animation-delay:.5s}
.logo .num{font-family:var(--f-d);font-weight:800}
.logo .scr{font-family:var(--f-s);font-weight:700}
.burst{position:absolute;inset:0;pointer-events:none;opacity:.18;background:radial-gradient(circle at 92% 10%,#e8772e 0 2px,transparent 3px),radial-gradient(circle at 80% 85%,#e8772e 0 2px,transparent 3px),radial-gradient(circle at 60% 20%,#f3a66f 0 1.5px,transparent 2.5px)}
.login .hero{flex-direction:column;text-align:center;padding:26px 18px}
.login .btn{justify-content:center}
@keyframes spark{0%{stroke-dashoffset:14;opacity:0}15%{opacity:1}55%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-14;opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.search{width:100%;font-size:1rem;padding:11px 12px}
.hit{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){.logo .spk,.logo .pop,.hero .ph{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const ST={pending:["Чака решение","b-pending"],approved:["Одобрена","b-approved"],counter:["Контраоферта","b-counter"],rejected:["Отказана","b-rejected"]};
let ME=null, FILTER="pending", FORM=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=(n,d=2)=>n==null||isNaN(n)?"—":Number(n).toFixed(d).replace(".",",");
const num=v=>{v=String(v).replace(",",".").trim();return v===""?null:Number(v)};
const dt=s=>s?s.slice(8,10)+"."+s.slice(5,7):"";
const canDecide=()=>ME&&["approver","admin"].includes(ME.role);
const isOffice=()=>ME&&["office","admin"].includes(ME.role);
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2600)}
async function api(p,o={}){
  const r=await fetch(p,{credentials:"same-origin",...o,headers:o.body&&!(o.body instanceof FormData)?{"Content-Type":"application/json"}:{}});
  if(r.status===401){ME=null;renderLogin();throw new Error("401")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||"Грешка");
  return j;
}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b)});

let TODAY=null;
async function today(){if(!TODAY){try{TODAY=await (await fetch("/api/today")).json()}catch(e){TODAY={phrase:""}}}return TODAY}
function logo(sz=96){
  const src=TODAY&&TODAY.logo?TODAY.logo:"/logo.png";
  const sp=[[50,-8,50,-20],[86,4,96,-6],[104,40,118,38],[14,4,4,-6],[-4,40,-18,38],[92,92,102,102],[8,92,-2,102]];
  return `<span class="logo" style="width:${sz*1.3}px;height:${sz}px">
    <svg viewBox="-24 -24 148 148" preserveAspectRatio="none" aria-hidden="true">${sp.map(([a,b,c,d])=>`<line class="spk" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`).join("")}</svg>
    <img class="pop" src="${esc(src)}" alt="Магазини 300"></span>`;
}
function hello(){const h=new Date().getHours();return h<11?"Добро утро":h<18?"Добър ден":"Добър вечер"}
const NAMES={asen:"Асен",dimo:"Димо",ofis:"екип"};
function heroHTML(){
  const d=new Date().toLocaleDateString("bg-BG",{weekday:"long",day:"numeric",month:"long"});
  return `<div class="hero"><div class="burst"></div>${logo(84)}<div class="tx">
    <div class="hi">${hello()}${ME?", "+esc(NAMES[ME.user]||ME.user):""}!</div>
    <div class="ph">${esc(TODAY&&TODAY.phrase||"")}</div><div class="dt">${esc(d)} · Магазини 300</div></div></div>`;
}

async function renderLogin(msg){
  await today();
  app.innerHTML=`<form class="login" id="lf"><div class="hero"><div class="burst"></div>${logo(120)}<div class="ph">${esc(TODAY.phrase||"")}</div></div>
   <h1 style="text-align:center">Брошури</h1>
   <input class="inp" id="lu" placeholder="Потребител" autocomplete="username" autocapitalize="none">
   <input class="inp" id="lp" placeholder="ПИН" type="password" inputmode="numeric" autocomplete="current-password">
   <button class="btn pri" type="submit">Вход</button><div class="muted">${esc(msg||"")}</div></form>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();try{ME=await post("/api/login",{user:$("#lu").value,pin:$("#lp").value});route()}catch(err){renderLogin(err.message)}};
}

async function renderList(){
  const [forms]=await Promise.all([api("/api/forms"),today()]);
  const cnt=k=>forms.filter(x=>k==="all"||x.status===k).length;
  const shown=forms.filter(x=>FILTER==="all"||x.status===FILTER);
  app.innerHTML=`<div class="top"><h1>Брошури <span>300</span></h1><span class="sp"></span><button class="btn" id="lo">Изход</button></div>
  ${heroHTML()}
  ${isOffice()?`<label class="drop" id="drop"><input type="file" id="fi" multiple accept=".xlsx,.xls,.xlsm,.pdf,image/*" hidden>
     <b>Качи бланки</b><br><span class="muted">Excel, PDF или снимка - може няколко наведнъж</span></label>
     <div class="top"><span class="muted">Бланките по имейл се прибират сами на 5 мин.</span><span class="sp"></span><button class="btn" id="mc">Провери пощата</button></div>
     <a class="btn pri" href="#new" style="justify-content:center">+ Нова брошура по доставчик</a>`:""}
  <div class="chips">${[["pending","Чакат"],["counter","Контраоферта"],["approved","Одобрени"],["rejected","Отказани"],["all","Всички"]]
    .map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${FILTER===k}">${l} · ${cnt(k)}</button>`).join("")}</div>
  <div class="list">${shown.map(x=>`<a class="card row-f" href="#f${x.id}"><div class="g">
      <div class="nm">${esc(x.supplier||"Без име на доставчик")}</div>
      <div class="muted">${x.kind==="comp"?"Компенсация":"Брошура"}${x.brochure_no?" № "+esc(x.brochure_no):""} · ${x.n_items} арт. · ${dt(x.promo_from)}–${dt(x.promo_to)}${x.has_warn?" · ⚠":""}${x.source==="email"?" · имейл":""}</div></div>
      ${x.sent_at?`<span class="badge b-sent">Изпратена</span>`:""}<span class="badge ${ST[x.status][1]}">${ST[x.status][0]}</span></a>`).join("")
    ||`<div class="card muted">Няма бланки тук.</div>`}</div>`;
  $("#lo").onclick=async()=>{await post("/api/logout",{});ME=null;renderLogin()};
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;renderList()});
  if(isOffice()){
    const d=$("#drop"),fi=$("#fi");
    fi.onchange=()=>upload(fi.files);
    d.ondragover=e=>{e.preventDefault();d.classList.add("on")};d.ondragleave=()=>d.classList.remove("on");
    d.ondrop=e=>{e.preventDefault();d.classList.remove("on");upload(e.dataTransfer.files)};
    $("#mc").onclick=async()=>{toast("Проверявам пощата…");try{const r=await post("/api/mail/check",{});toast(r.new?`Нови бланки: ${r.new}`:"Няма нови бланки");renderList()}catch(e){toast(e.message)}};
  }
}
async function upload(files){
  if(!files.length)return;
  const fd=new FormData();[...files].forEach(x=>fd.append("files",x));
  toast(`Разчитам ${files.length} файл(а)… около 20 сек. на бланка`);
  try{const r=await api("/api/upload",{method:"POST",body:fd});
    toast(r.errors.length?r.errors.join(" · "):`Готово: ${r.ids.length} бланки`);
    if(r.ids.length===1)location.hash="f"+r.ids[0];else renderList();
  }catch(e){toast(e.message)}
}

const mcls=m=>m==null?"":m>=22?"m-good":m>=15?"m-mid":"m-low";
function itemHTML(it,kind){
  const dis=canDecide()?"":"disabled";
  const nv=v=>v==null?"":String(Number(v)).replace(".",",");
  const need=it.need_delivery!=null?`<span>За ${f(it.min_margin,0)}% марж искаме доставна <b class="${it.cost!=null&&it.cost>it.need_delivery?"g-bad":"g-ok"}">≤ ${f(it.need_delivery,4)}</b>${it.need_dto!=null?` (Д.Т.О. ${f(it.need_dto,1)}%)`:""}</span>`:"";
  const fund=(it.funded==null?"":it.funded>0.005?`<span class="g-bad">Доплащаме ${f(it.funded)} €/бр.${it.sales30?` × ${it.sales30} = <b>${f(it.funded*it.sales30,0)} €</b>`:""}</span>`:`<span class="g-ok">Доставчикът покрива отстъпката</span>`)+need;
  const reg=(lbl,v)=>v==null?"":`<span>${lbl} <b>${v}</b> бр.</span>`;
  return `<div class="item" data-id="${it.id}">
    <div><div class="it-n">${esc(it.name)}</div>
    <div class="code">${it.code?`<b>${it.code}</b>`:`<span class="g-bad">няма код</span>`} · ${esc(it.barcode||"без баркод")}${it.m_name&&it.m_name!==it.name?` · ${esc(it.m_name)}`:""}</div></div>
    <div class="prices">${reg("Продажби 30 д. Варна",it.sales30_varna)}${reg("София",it.sales30_sofia)}${it.stock!=null?`<span>Наличност <b>${it.stock}</b>${it.stores?` · в ${it.stores} м-на`:""}</span>`:""}
      ${it.margin30!=null?`<span>Марж каса <b>${f(it.margin30,1)}%</b></span>`:""}
      ${it.last_promo?`<span>Последна брошура <b>${esc(it.last_promo)}</b>${it.uplift?` · ×${f(it.uplift,1)}`:""}</span>`:it.code?`<span>Не е бил в брошура</span>`:""}</div>
    <div class="grp">Доставчик${it.reg_src?` · редовна от: ${esc(it.reg_src)}`:""}</div>
    <div class="entry">
      ${kind==="comp"?`<div class="fld"><label>Компенсация/бр.</label><input data-k="comp" value="${nv(it.comp)}" disabled></div>`:""}
      <div class="fld"><label>Базова с ДДС</label><input data-k="base" inputmode="decimal" value="${nv(it.base)}"></div>
      <div class="fld"><label>Т.О. %</label><input data-k="to_pct" inputmode="decimal" value="${nv(it.to_pct)}"></div>
      <div class="fld"><label>Редовна дост.</label><input data-k="reg" inputmode="decimal" value="${nv(it.reg)}"></div>
      <div class="fld"><label>Д.Т.О. %</label><input data-k="dto_pct" inputmode="decimal" value="${nv(it.dto_pct)}"></div>
      <div class="fld"><label>Промо дост.</label><input data-k="promo" inputmode="decimal" value="${nv(it.promo)}"></div>
      ${it.code?"":`<div class="fld"><label>Наш код</label><input data-k="code" inputmode="numeric" value=""></div>`}
    </div>
    <div class="prices">${fund}</div>
    <div class="grp">Купувач</div>
    <div class="entry">
      <div class="fld"><label>Рафт сега</label><input data-k="shelf" inputmode="decimal" value="${it.shelf==null?"":f(it.shelf)}"></div>
      <div class="fld"><label>Промо рафт</label><input class="pen" data-k="approved" inputmode="decimal" value="${it.approved==null?"":f(it.approved)}" ${dis}></div>
      <div class="fld"><label>Отстъпка %</label><input data-k="pct" inputmode="decimal" value="${it.off_pct??""}" ${dis}></div>
      <div class="mg"><div class="k">Марж ${it.reg_margin!=null?`<span style="text-transform:none">(сега ${f(it.reg_margin,1)}%)</span>`:""}</div><div class="v ${mcls(it.margin)}">${it.margin==null?"—":f(it.margin,1)+"%"}</div></div>
    </div></div>`;
}
async function renderForm(id){
  FORM=await api("/api/forms/"+id);
  const F=FORM, it=F.items;
  const ms=it.map(x=>x.margin).filter(x=>x!=null);
  const tot=it.reduce((a,x)=>a+(x.funded>0&&x.sales30?x.funded*x.sales30:0),0);
  const reg=[F.region_varna?"Варна":null,F.region_sofia?"София":null].filter(Boolean).join(", ")||"—";
  app.innerHTML=`<a class="back" href="#">‹ Всички бланки</a>
  <div><h1>${esc(F.supplier||"Без име на доставчик")}</h1>
   <div class="muted">${F.kind==="comp"?"Компенсация за продадена бройка":"Рекламна брошура"}${F.brochure_no?" № "+esc(F.brochure_no):""} · промоция ${dt(F.promo_from)}–${dt(F.promo_to)} · цени ${dt(F.price_from)}–${dt(F.price_to)} · ${reg}</div></div>
  ${F.warnings?`<div class="warn">${esc(F.warnings)}</div>`:""}
  <div class="stats"><div class="stat"><div class="n">${it.length}</div><div class="l">артикула</div></div>
   <div class="stat"><div class="n">${it.filter(x=>x.approved!=null).length}</div><div class="l">с цена</div></div>
   <div class="stat"><div class="n">${ms.length?f(ms.reduce((a,b)=>a+b,0)/ms.length,1)+"%":"—"}</div><div class="l">среден марж</div></div>
   <div class="stat"><div class="n">${f(tot,0)} €</div><div class="l">доплащаме*</div></div></div>
  <div class="card">${it.map(x=>itemHTML(x,F.kind)).join("")}</div>
  <div class="card dec">
    <div class="r"><label class="muted" for="fmt">Формат</label><select id="fmt" ${canDecide()?"":"disabled"}>${["","Единично каре","А5","А4","Брошура"].map(o=>`<option ${o===(F.fmt||"")?"selected":""}>${o}</option>`).join("")}</select>
      ${F.wanted_format?`<span class="muted">Искат: ${esc(F.wanted_format)}</span>`:""}</div>
    <textarea id="note" placeholder="Бележка към доставчика (напр. искаме по-висока Д.Т.О.)" ${canDecide()?"":"disabled"}>${esc(F.note||"")}</textarea>
    ${canDecide()?`<div class="r">${[["approved","Одобри","a"],["counter","Контраоферта","c"],["rejected","Откажи","x"]]
      .map(([k,l,c])=>`<button class="btn ${c}" data-st="${k}" aria-pressed="${F.status===k}">${l}</button>`).join("")}</div>`
      :`<div><span class="badge ${ST[F.status][1]}">${ST[F.status][0]}</span> ${F.decided_by?`<span class="muted">от ${esc(F.decided_by)}</span>`:""}</div>`}
  </div>
  <div class="card dec"><div class="r">
    <a class="btn pri" href="/api/forms/${F.id}/blank.xlsx">Бланка 6Б с цените</a>
    <a class="btn" href="/api/forms/${F.id}/answer.xlsx">Отговор Excel</a>
    ${(F.file_name||"").toLowerCase().match(/\.xls[xm]$/)?`<a class="btn" href="/api/forms/${F.id}/filled.xlsx">Попълнена оригинална бланка</a>`:""}
    <a class="btn" href="/api/forms/${F.id}/original">Оригинал</a>
    <button class="btn" id="rf">Обнови от Мистрал</button>
    ${isOffice()?(F.sent_at?`<span class="badge b-sent">Изпратена ${dt(F.sent_at)}</span>`:`<button class="btn" id="sent" ${F.status==="pending"?"disabled":""}>Отбележи изпратена</button>`):""}
    ${isOffice()?`<button class="btn" id="del">Изтрий</button>`:""}
  </div><div class="muted">* Доплащаме = свалената рафтова цена минус отстъпката на доставчика, по продажбите за 30 дни.${F.source==="email"?" Дошла по имейл от "+esc(F.source_from||""):""}</div></div>`;
  app.querySelectorAll(".item input").forEach(inp=>inp.onchange=()=>saveItem(inp));
  app.querySelectorAll("[data-st]").forEach(b=>b.onclick=async()=>{
    const s=F.status===b.dataset.st?"pending":b.dataset.st;
    await post(`/api/forms/${F.id}`,{status:s,fmt:$("#fmt").value,note:$("#note").value});toast(s==="pending"?"Решението е махнато":ST[s][0]);renderForm(F.id)});
  if(canDecide()){$("#fmt").onchange=()=>post(`/api/forms/${F.id}`,{fmt:$("#fmt").value});$("#note").onchange=()=>post(`/api/forms/${F.id}`,{note:$("#note").value}).then(()=>toast("Бележката е записана"))}
  $("#rf").onclick=async()=>{toast("Обновявам от Мистрал…");const r=await post(`/api/forms/${F.id}/refresh`,{});toast(r.notes&&r.notes.length?r.notes.join(" · "):"Обновено");renderForm(F.id)};
  if($("#sent"))$("#sent").onclick=async()=>{await post(`/api/forms/${F.id}/sent`,{});toast("Отбелязана като изпратена");renderForm(F.id)};
  if($("#del")){let armed=false;$("#del").onclick=async e=>{if(!armed){armed=true;e.target.textContent="Сигурен ли си? Натисни пак";return}
    await api(`/api/forms/${F.id}`,{method:"DELETE"});toast("Изтрита");location.hash=""}}
}
async function saveItem(inp){
  const id=inp.closest(".item").dataset.id, k=inp.dataset.k, v=num(inp.value), it=FORM.items.find(x=>x.id==id);
  let body={};
  if(k==="pct"){if(!it.shelf||v==null){toast("Първо въведи рафтовата цена");return}body.approved=Math.round(it.shelf*(1-v/100)*100)/100}
  else if(k==="approved"&&v==null)body.clear_approved=true;
  else body[k]=k==="sales30"||k==="code"?Math.round(v):v;
  try{FORM=await post("/api/items/"+id,body);const y=window.scrollY;await renderForm(FORM.id);window.scrollTo(0,y)}catch(e){toast(e.message)}
}
let SUPS=null, ARTS=[], PICK=new Set(), QRY="", QT=null;
const matches=(a,q)=>{q=q.trim().toUpperCase();if(!q)return true;if(/^\d+$/.test(q))return String(a.code).startsWith(q);
  return q.split(/\s+/).every(w=>(a.name||"").toUpperCase().includes(w))};
async function renderNew(){
  if(!SUPS)SUPS=await api("/api/suppliers");
  const today=new Date().toISOString().slice(0,10);
  app.innerHTML=`<a class="back" href="#">‹ Всички бланки</a><h1>Нова брошура</h1>
  <div class="card dec">
    <div class="fld"><label for="sup">Доставчик</label><input class="inp" id="sup" list="supl" placeholder="Започни да пишеш…" style="width:100%" autocomplete="off"></div>
    <datalist id="supl">${SUPS.map(x=>`<option value="${esc(x.supplier)}">${x.n} арт.</option>`).join("")}</datalist>
    <div class="r"><div class="fld"><label for="pf">Промоция от</label><input class="inp" type="date" id="pf"></div>
      <div class="fld"><label for="pt">до</label><input class="inp" type="date" id="pt"></div>
      <div class="fld"><label for="bn">Брошура №</label><input class="inp" id="bn" style="width:90px"></div></div>
    <div class="r"><div class="fld"><label for="rf">Доставни цени от</label><input class="inp" type="date" id="rf"></div>
      <div class="fld"><label for="rt">до</label><input class="inp" type="date" id="rt"></div></div>
    <div class="r"><label><input type="checkbox" id="rv" checked> Варна</label><label><input type="checkbox" id="rs" checked> София</label></div>
  </div>
  <div class="card dec"><input class="inp search" id="q" type="search" placeholder="Търси артикул: име, код или баркод" autocomplete="off">
    <div id="hits"></div></div>
  <div id="arts"></div>
  <button class="btn pri" id="mk" disabled style="justify-content:center">Създай бланката</button>`;
  const pf=$("#pf"),rf=$("#rf");
  pf.onchange=()=>{if(pf.value&&!rf.value){const d=new Date(pf.value);d.setDate(d.getDate()-7);rf.value=d.toISOString().slice(0,10)}};
  $("#pt").onchange=()=>{const t=$("#pt").value;if(t&&!$("#rt").value){const d=new Date(t);d.setDate(d.getDate()+7);$("#rt").value=d.toISOString().slice(0,10)}};
  const loadSup=async(n,pre)=>{
    $("#sup").value=n;$("#arts").innerHTML=`<div class="card muted">Зареждам артикулите…</div>`;
    ARTS=await api("/api/suppliers/articles?name="+encodeURIComponent(n));PICK=new Set(pre?[pre]:[]);
    if(pre&&!ARTS.some(a=>a.code===pre))QRY="";drawArts();
  };
  $("#sup").onchange=()=>{const n=$("#sup").value.trim();if(SUPS.some(x=>x.supplier===n)){QRY="";$("#q").value="";$("#hits").innerHTML="";loadSup(n)}};
  $("#q").oninput=()=>{
    QRY=$("#q").value;clearTimeout(QT);
    const local=ARTS.length&&!/^\d{8,}$/.test(QRY.trim());
    if(local){drawArts();if(ARTS.some(a=>matches(a,QRY))){$("#hits").innerHTML="";return}}
    if(QRY.trim().length<2){$("#hits").innerHTML="";return}
    QT=setTimeout(async()=>{
      const r=await api("/api/articles/search?q="+encodeURIComponent(QRY.trim()));
      $("#hits").innerHTML=r.length?`<div class="muted" style="padding-top:8px">${ARTS.length?"Няма го при този доставчик. Намерих го тук:":"Резултати:"}</div>`+
        r.map(a=>`<button type="button" class="hit" data-s="${esc(a.supplier)}" data-c="${a.code}"><div style="flex:1;min-width:0">
          <div class="it-n">${esc(a.name)}</div><div class="prices"><span class="code">${a.code}</span><span><b>${a.sales30}</b> бр./30 д.</span><span>${esc(a.supplier||"без доставчик")}</span></div></div>
          <span class="badge b-pending">Избери</span></button>`).join(""):`<div class="muted" style="padding-top:8px">Няма такъв артикул.</div>`;
      $("#hits").querySelectorAll(".hit").forEach(b=>b.onclick=()=>{if(!b.dataset.s){toast("Артикулът няма доставчик в MinMaxAI");return}
        QRY="";$("#q").value="";$("#hits").innerHTML="";loadSup(b.dataset.s,+b.dataset.c);toast("Избран е доставчикът и артикулът")});
    },300);
  };
  $("#mk").onclick=async()=>{
    $("#mk").disabled=true;toast("Създавам бланката…");
    try{const r=await post("/api/forms/new",{supplier:$("#sup").value.trim(),codes:[...PICK],brochure_no:$("#bn").value||null,
      promo_from:$("#pf").value||null,promo_to:$("#pt").value||null,price_from:$("#rf").value||null,price_to:$("#rt").value||null,
      region_varna:$("#rv").checked,region_sofia:$("#rs").checked});
      SUPS=null;location.hash="f"+r.id;toast("Бланката е създадена. Асен получи известие.")}
    catch(e){toast(e.message);$("#mk").disabled=false}
  };
}
function drawArts(){
  const box=$("#arts");
  if(!ARTS.length){box.innerHTML=`<div class="card muted">Няма продавани артикули от този доставчик.</div>`;return}
  const list=ARTS.filter(a=>matches(a,QRY)||PICK.has(a.code));
  box.innerHTML=`<div class="card"><div class="r" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:6px">
     <b>${QRY.trim()?`${list.length} от ${ARTS.length}`:ARTS.length} артикула</b><span class="muted" id="cnt"></span><button class="btn" id="top">Топ 10 по продажби</button></div>
   ${list.map(a=>`<label class="item" style="flex-direction:row;align-items:center;gap:12px;cursor:pointer">
      <input type="checkbox" data-c="${a.code}" ${PICK.has(a.code)?"checked":""} style="width:20px;height:20px">
      <div style="flex:1;min-width:0"><div class="it-n">${esc(a.name)}</div>
      <div class="prices"><span>Варна <b>${a.varna??a.sales30}</b></span><span>София <b>${a.sofia??0}</b> бр./30 д.</span>${a.margin30!=null?`<span>марж <b>${f(a.margin30,1)}%</b></span>`:""}${a.stock!=null?`<span>налични ${a.stock}</span>`:""}
      ${a.last_promo?`<span>брошура ${esc(a.last_promo)}${a.uplift?` ×${f(a.uplift,1)}`:""}</span>`:""}<span class="code">${a.code}</span></div></div></label>`).join("")}</div>`;
  const upd=()=>{$("#cnt").textContent=PICK.size?`избрани ${PICK.size}`:"";$("#mk").disabled=!PICK.size};
  box.querySelectorAll("[data-c]").forEach(cb=>cb.onchange=()=>{const c=+cb.dataset.c;cb.checked?PICK.add(c):PICK.delete(c);upd()});
  $("#top").onclick=()=>{ARTS.slice(0,10).forEach(a=>PICK.add(a.code));drawArts()};
  upd();
}
async function route(){
  if(!ME){try{ME=await api("/api/me")}catch(e){return}}
  if(location.hash==="#new"){try{await renderNew()}catch(e){toast(e.message)}return}
  const m=location.hash.match(/^#f(\d+)/);
  try{m?await renderForm(m[1]):await renderList()}catch(e){if(e.message!=="401")toast(e.message)}
}
addEventListener("hashchange",route);route();
</script>
</body>
</html>
